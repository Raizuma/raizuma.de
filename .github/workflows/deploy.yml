name: Deploy Raizuma Web

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure known hosts
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Build Docker image
        env:
          IMAGE_NAME: raizuma.de
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          docker build \
            --no-cache \
            --tag "$IMAGE_NAME:$IMAGE_TAG" \
            --tag "$IMAGE_NAME:latest" \
            .

      - name: Export Docker image
        env:
          IMAGE_NAME: raizuma.de
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          docker save "$IMAGE_NAME:$IMAGE_TAG" | gzip > raizuma.de.tar.gz

      - name: Upload Docker image
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IMAGE_DIR: ${{ secrets.SERVER_IMAGE_DIR }}
        run: |
          set -euo pipefail

          ssh "$SERVER_USER@$SERVER_IP" \
            "mkdir -p '$SERVER_IMAGE_DIR'"

          scp raizuma.de.tar.gz \
            "$SERVER_USER@$SERVER_IP:$SERVER_IMAGE_DIR/raizuma.de.tar.gz"

      - name: Load image and restart application
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IMAGE_DIR: ${{ secrets.SERVER_IMAGE_DIR }}
          APP_DIR: ${{ secrets.APP_DIR }}
          IMAGE_NAME: raizuma.de
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          ssh "$SERVER_USER@$SERVER_IP" \
            "SERVER_IMAGE_DIR='$SERVER_IMAGE_DIR' \
             APP_DIR='$APP_DIR' \
             IMAGE_NAME='$IMAGE_NAME' \
             IMAGE_TAG='$IMAGE_TAG' \
             bash -s" <<'SSHEND'
          set -euo pipefail

          cd "$APP_DIR"

          echo "Loading Docker image..."
          gunzip -c "$SERVER_IMAGE_DIR/raizuma.de.tar.gz" | docker load

          echo "Starting Docker Compose..."
          IMAGE_TAG="$IMAGE_TAG" docker compose up -d --force-recreate

          echo "Removing old Docker images..."
          docker image prune -f

          echo "Removing uploaded archive..."
          rm -f "$SERVER_IMAGE_DIR/raizuma.de.tar.gz"
          SSHEND
